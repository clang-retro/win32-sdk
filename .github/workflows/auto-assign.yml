# Auto-assign new issues.
#
# This workflow starts when a person opens an issue in this repository.
# It adds the maintainer (Neo-Desktop) to the assignees of that issue.
# It does not remove the assignees that are already on the issue.
name: Auto-assign issues

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  # Add the maintainer as an assignee of the new issue.
  # The job uses the GITHUB_TOKEN with write permission for issues only.
  assign:
    name: Assign maintainer
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ASSIGNEE: Neo-Desktop
        run: gh issue edit "$ISSUE_NUMBER" --add-assignee "$ASSIGNEE"
