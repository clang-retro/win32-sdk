# Settings shared by every clang-retro documentation site. Each repository's
# mkdocs.yml inherits them (INHERIT) and adds its name, pages and links.
# SPDX-License-Identifier: AGPL-3.0-only

copyright: Copyright &copy; clang-retro contributors &middot; AGPL-3.0-only

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Automatic mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/retro.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: info
    absolute_links: info
    unrecognized_links: info

extra:
  generator: false
  social:
    - icon: material/view-grid-outline
      link: https://clang-retro.github.io/
      name: All clang-retro projects
    - icon: fontawesome/brands/github
      link: https://github.com/clang-retro
      name: clang-retro on GitHub
