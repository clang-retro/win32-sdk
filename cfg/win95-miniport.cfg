# SCSI miniports (.mpd) for Windows 95, 98 and ME: NT-style PE drivers
# that SCSIPORT.PDR loads, importing only SCSIPORT.SYS's functions (the
# 45 in tools/scsiport9x-exports.txt; check with check-imports.py
# --miniport). The headers are <miniport.h>, <srb.h> and <scsi.h> with
# the structures of 9x's SCSIPORT (Windows NT 3.51's), not the later ones of
# mingw-w64's DDK headers, and functions and callbacks are stdcall (-mrtd), as the DDK
# builds them with cl -Gz. libvxd.a has memcpy, memset and the like. See
# README.md, "SCSI miniports".
--target=i386-pc-windows4.0-gnu
--sysroot=<CFGDIR>/../sysroots/win9x-msvcrt
-fuse-ld=lld
-isystem <CFGDIR>/../sysroots/win9x-msvcrt/include/miniport9x
-mrtd
-ffreestanding
-mno-sse -mno-mmx
-fno-stack-protector
-fno-asynchronous-unwind-tables
-fno-exceptions -fno-rtti
-mno-stack-arg-probe
-nostdlib
-Wl,--subsystem,native
-Wl,--entry,_DriverEntry@8
-Wl,--image-base,0x10000
-Wl,--disable-tsaware
-Wl,--Xlink=-driver
-Wl,--Xlink=-release
-lscsiport9x -lvxd -lgcc
