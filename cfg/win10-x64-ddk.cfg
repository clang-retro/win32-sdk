# Windows 10 and 11 x64 kernel-mode drivers (.sys) with mingw-w64's DDK headers
# (<ntddk.h>, <wdm.h>, <ntifs.h>, ...) and import libraries (-lntoskrnl,
# -lhal, -lndis, ...); see README.md, "Drivers"
@win10-x64.cfg
-isystem <CFGDIR>/../sysroots/win-vista-x64/include/ddk
-U_WIN32_WINNT
-D_WIN32_WINNT=0x0A00
-nostdlib
-Wl,--subsystem,native
-Wl,--entry,DriverEntry
-Wl,--image-base,0x10000
-Wl,--disable-tsaware
-Wl,--Xlink=-driver
-Wl,--Xlink=-release
-lntoskrnl -lhal -lgcc
