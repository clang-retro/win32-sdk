# VxDs (LE virtual device drivers) for Windows 95, 98 and ME: compile with
# -c and link with share/clang-dos/vxd-link.py; see README.md, "VxDs"
--target=i386-pc-windows4.0-gnu
--sysroot=<CFGDIR>/../sysroots/win9x-msvcrt
-ffreestanding
-mno-sse -mno-mmx
-fno-stack-protector
-fno-asynchronous-unwind-tables
-fno-exceptions -fno-rtti
