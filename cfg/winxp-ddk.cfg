# Windows XP kernel-mode drivers (.sys) with mingw-w64's DDK headers
# (<ntddk.h>, <wdm.h>, <ntifs.h>, ...) and import libraries (-lntoskrnl,
# -lhal, -lndis, ...); see README.md, "Drivers"
@winxp.cfg
-isystem <CFGDIR>/../sysroots/win2k-xp/include/ddk
-U_WIN32_WINNT
-D_WIN32_WINNT=0x0501
-mno-sse -mno-mmx
# SEH: __try, __except and __finally (-fms-extensions), with tables
# for _except_handler3 (libntseh.a's), and faults in the __try block
# caught (-fasync-exceptions, as cl does).
-fms-extensions -fseh-exceptions -fasync-exceptions
-nostdlib
-Wl,--subsystem,native
-Wl,--entry,_DriverEntry@8
-Wl,--image-base,0x10000
-Wl,--disable-tsaware
-Wl,--Xlink=-driver
-Wl,--Xlink=-release
-lntseh -lntoskrnl -lhal -lgcc
