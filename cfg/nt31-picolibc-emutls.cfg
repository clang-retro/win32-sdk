# Windows NT 3.1, 3.5 and 3.51 (and every later 32-bit Windows) with
# picolibc as the C library, with emulated TLS: for a DLL that
# LoadLibrary loads on a Windows before Vista.
--target=i386-pc-windows3.10-gnu
--sysroot=<CFGDIR>/../sysroots/win32-picolibc
-fuse-ld=lld
-stdlib=libc++
-femulated-tls
-L<CFGDIR>/../sysroots/win32-picolibc/lib/emutls
-nostartfiles
-nodefaultlibs
$-lc++
$-lunwind
$-lc
$-lm
$-lclang_rt.builtins-i386
$-ladvapi32
$-lshell32
$-luser32
$-lkernel32
