# Windows NT 4.0 kernel-mode drivers (.sys) with mingw-w64's DDK headers
# (<ntddk.h>, <wdm.h>, <ntifs.h>, ...) and import libraries (-lntoskrnl,
# -lhal, -lndis, ...); see README.md, "Drivers".
# The headers declare the kernel API of Windows 2000: check-imports.py
# --nt VERSION finds the functions that this version does not have.
@nt4.cfg
-isystem <CFGDIR>/../sysroots/win9x-msvcrt/include/ddk
-U_WIN32_WINNT
-D_WIN32_WINNT=0x0500
-mno-sse -mno-mmx
-nostdlib
-Wl,--subsystem,native
-Wl,--entry,_DriverEntry@8
-Wl,--image-base,0x10000
-Wl,--disable-tsaware
-Wl,--Xlink=-driver
-Wl,--Xlink=-release
-lntoskrnl -lhal -lgcc
