# Windows 95, 98, ME and NT 4.0 and later with picolibc as the C library,
# with emulated TLS: for a DLL that LoadLibrary loads on a Windows before
# Vista, where native TLS works only in modules loaded at startup.
--target=i386-pc-windows4.0-gnu
--sysroot=<CFGDIR>/../sysroots/win32-picolibc
-fuse-ld=lld
-stdlib=libc++
-femulated-tls
-L<CFGDIR>/../sysroots/win32-picolibc/lib/emutls
-nostartfiles
-nodefaultlibs
$-lc++
$-lunwind
$-lc
$-lm
$-lclang_rt.builtins-i386
$-ladvapi32
$-lshell32
$-luser32
$-lkernel32
